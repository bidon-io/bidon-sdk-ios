name: Check Changelog

on:
  pull_request:
    types:
      - opened
      - synchronize
  # PRs created by github-actions[bot] may not trigger `pull_request` workflows.
  # Trigger on push to pod-updater branches so the required check is still reported (skipped).
  push:
    branches:
      - chore/pod-**

jobs:
  check_changelog:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'chore/pod-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Changelog Changes
        id: changelog-check
        run: |
          files_changed=$(git diff --name-only --diff-filter=ACMRT HEAD^ HEAD | xargs)
          if echo "$files_changed" | tr ' ' '\n' | grep -q "CHANGELOG.md"; then
            echo "Changelog has been updated."
          else
            echo "Error: Changelog has not been updated." && exit 1
          fi

