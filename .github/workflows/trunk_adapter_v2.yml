name: Trunk Adapter v2

on:
  workflow_dispatch:
    inputs:
      adapter_name:
        description: 'Adapter name (e.g. BidonAdapterIronSource)'
        required: true
        type: string
      adapter_version:
        description: 'Adapter version (e.g. 3.0.1.0)'
        required: true
        type: string
      sdk_version:
        description: 'SDK version (e.g. 1.1.0 or 1.1.0-alpha.1)'
        required: true
        type: string
      validate:
        description: 'Perform full CocoaPods validations (tests, imports)?'
        required: true
        type: boolean
        default: false

jobs:
  trunk-adapter-v2:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitconfig
        run: |
          git config --global user.name "bidon-runner"
          git config --global user.email "runner@bidon.org"

      - name: Verify Xcode (self-hosted)
        run: |
          xcodebuild -version

      - name: CocoaPods install (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" install 2>&1 | tee "$RUNNER_TEMP/pod_install.log"

      - name: Generate podspecs via Fastlane
        run: |
          set -o pipefail
          /opt/homebrew/opt/ruby@3.2/bin/bundle exec fastlane generate_specs \
            version:${{ inputs.sdk_version }} \
            adapters_version:${{ inputs.adapter_version }}

      - name: Push selected adapter podspec to trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -euo pipefail
          spec_path="build/Podspecs/${{ inputs.adapter_name }}.podspec.json"
          if [ ! -f "$spec_path" ]; then
            echo "❌ Podspec not found at $spec_path"
            exit 1
          fi
          CMD="pod trunk push \"$spec_path\" --allow-warnings"
          if [ "${{ inputs.validate }}" = "false" ]; then
            CMD="$CMD --skip-tests --skip-import-validation"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *Adapter Podspec Pushed to Trunk (v2)!*\n• Adapter: `${{ inputs.adapter_name }}`\n• Version: `${{ inputs.adapter_version }}`\n• SDK: `${{ inputs.sdk_version }}`\n• Validate: `${{ inputs.validate }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *Adapter Podspec Push Failed (v2)!*\n• Adapter: `${{ inputs.adapter_name }}`\n• Version: `${{ inputs.adapter_version }}`\n• SDK: `${{ inputs.sdk_version }}`\n• Validate: `${{ inputs.validate }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      


