name: Pods PR CI (pre-merge)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run CI for'
        required: true
        type: string
      head_ref:
        description: 'PR head ref (branch)'
        required: true
        type: string
      head_sha:
        description: 'PR head sha (optional, will use head_ref if empty)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]
    if: >
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'chore/pod-'))
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.head_ref, 'chore/pod-'))
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha || inputs.head_ref }}
          fetch-depth: 0

      - name: Load PR body on dispatch
        id: load_body
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          PR=${{ inputs.pr_number }}
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          BODY=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/pulls/${PR}" | jq -r '.body // ""')
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract build metadata
        id: meta
        run: |
          ruby - <<'RUBY'
          body = ENV['PR_BODY'].to_s
          m = body.match(/<!--\s*build-metadata\s*(\{[\s\S]*?\})\s*-->/m)
          if m
            json = m[1]
            require 'json'
            data = JSON.parse(json)
            File.open(ENV['GITHUB_OUTPUT'], 'a') do |f|
              f.puts "pod=#{data['pod']}"
              f.puts "from=#{data['from']}"
              f.puts "to=#{data['to']}"
              f.puts "adapter=#{data['adapter']}"
            end
          end
          RUBY
        env:
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || steps.load_body.outputs.body }}

      - name: CocoaPods repo update (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" repo update 2>&1 | tee "$RUNNER_TEMP/pod_repo_update.log"

      - name: CocoaPods install (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" install 2>&1 | tee "$RUNNER_TEMP/pod_install.log"

      - name: Build only changed adapter (if scheme exists)
        id: build_adapter
        if: steps.meta.outputs.adapter != ''
        run: |
          set -euo pipefail
          ADAPTER="${{ steps.meta.outputs.adapter }}"
          DD="$GITHUB_WORKSPACE/DerivedData"
          mkdir -p "$DD" Result build/reports || true
          echo "Looking for scheme: $ADAPTER"
          xcodebuild -list -json -workspace BidOn.xcworkspace | tee xclist.json >/dev/null
          HAS_SCHEME=$(jq -r --arg s "$ADAPTER" '.workspace.schemes | index($s) // empty' xclist.json | wc -l | tr -d ' ')
          if [ "${HAS_SCHEME:-0}" -gt 0 ]; then
            echo "Found scheme '$ADAPTER'. Building (no tests)…"
            xcodebuild build \
              -workspace BidOn.xcworkspace \
              -scheme "$ADAPTER" \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$DD" \
              | tee build/reports/build_adapter.log \
              | xcbeautify
            echo "build=ok" >> "$GITHUB_OUTPUT"
          else
            echo "Scheme '$ADAPTER' not found. Skipping build-only path."
            echo "build=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Run adapter tests (fallback to full suite)
        if: steps.build_adapter.outputs.build != 'ok'
        run: |
          set -euo pipefail
          echo "Selecting iOS Simulator runtime via simctl…"
          RUNTIME_ID=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select((.availability?=="(available)" or .isAvailable==true) and (.identifier|test("iOS"))) | .identifier] | sort | last')
          if [ -z "${RUNTIME_ID:-}" ] || [ "$RUNTIME_ID" = "null" ]; then
            echo "No available iOS simulator runtime found";
            xcrun simctl list runtimes || true;
            exit 1;
          fi
          echo "Using runtime: $RUNTIME_ID"
          DEST_ID=$(xcrun simctl list devices -j \
            | jq -r --arg rid "$RUNTIME_ID" '((.devices[$rid] // []) | map(select(.isAvailable==true)) | map(.udid) | .[0])')
          if [ -z "${DEST_ID:-}" ] || [ "$DEST_ID" = "null" ]; then
            echo "No device under $RUNTIME_ID, falling back to any available device";
            DEST_ID=$(xcrun simctl list devices -j \
              | jq -r '[.devices[] | .[] | select(.isAvailable==true) | .udid][0]')
          fi
          if [ -z "${DEST_ID:-}" ] || [ "$DEST_ID" = "null" ]; then
            echo "No available iOS Simulator device";
            xcrun simctl list devices || true;
            exit 1;
          fi
          DD="$GITHUB_WORKSPACE/DerivedData"
          mkdir -p "$DD" Result build/reports || true
          xcodebuild test \
            -workspace BidOn.xcworkspace \
            -scheme AdaptersTests \
            -sdk iphonesimulator \
            -destination "id=$DEST_ID" \
            -derivedDataPath "$DD" \
            -resultBundlePath Result/AdaptersTests.xcresult \
             | tee build/reports/test_output.log \
             | xcbeautify

      - name: Report PR status (success)
        if: success()
        run: |
          set -euo pipefail
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha || github.sha }}"
          TARGET="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Posting success status for $SHA"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}" \
            -d @- <<JSON
          {
            "state": "success",
            "context": "Pods PR CI",
            "description": "Pods pre-merge checks passed",
            "target_url": "${TARGET}"
          }
JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report PR status (failure)
        if: failure()
        run: |
          set -euo pipefail
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha || github.sha }}"
          TARGET="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Posting failure status for $SHA"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}" \
            -d @- <<JSON
          {
            "state": "failure",
            "context": "Pods PR CI",
            "description": "Pods pre-merge checks failed",
            "target_url": "${TARGET}"
          }
JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


