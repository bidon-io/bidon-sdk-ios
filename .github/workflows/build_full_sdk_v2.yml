name: Build Bidon SDK v2

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version (e.g. 1.1.0)'
        required: true
        type: string
      pre:
        description: 'Prerelease tag (e.g. alpha.1, ver.1)'
        required: false
        type: string
        default: ''
      adapters_revision:
        description: 'Adapters revision (number or mapping, e.g. 0 or BidonAdapterMoloco=2)'
        required: false
        type: string
        default: '0'
      use_network_versions:
        description: 'Use network SDK versions for adapters'
        required: false
        type: boolean
        default: true
      upload:
        description: 'Upload to AWS?'
        required: true
        type: boolean
        default: false
      push_specs:
        description: 'Push generated podspecs to repo?'
        required: true
        type: boolean
        default: false

jobs:
  build-bidon-sdk:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: gitconfig
        run: |
            git config --global user.name "bidon-runner"
            git config --global user.email "runner@bidon.org"

      - name: Verify Xcode (self-hosted)
        run: |
          xcodebuild -version

      - name: Use Homebrew Ruby
        run: |
          /opt/homebrew/opt/ruby/bin/ruby -v
          /opt/homebrew/opt/ruby/bin/gem env home
          /opt/homebrew/opt/ruby/bin/bundler -v || /opt/homebrew/opt/ruby/bin/gem install bundler -N
        
      # self-hosted: Xcode и SDK уже подготовлены на машине

      # Ruby/Bundler установлены на self-hosted машине (brew ruby 3.4.6)

      - name: Install dependencies
        run: |
          /opt/homebrew/opt/ruby/bin/bundle config set path vendor/bundle
          /opt/homebrew/opt/ruby/bin/bundle install --jobs 4 --retry 3

      # Кэш и .netrc не используем на self-hosted (среда постоянная)

      - name: Install CocoaPods (Fastlane)
        run: /opt/homebrew/opt/ruby/bin/bundle exec fastlane pods_install

      - name: Run adapter tests
        run: |
          set -euo pipefail
          echo "Selecting iOS Simulator runtime via simctl…"
          RUNTIME_ID=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select((.availability?=="(available)" or .isAvailable==true) and (.identifier|test("iOS"))) | .identifier] | sort | last')
          if [ -z "${RUNTIME_ID:-}" ] || [ "$RUNTIME_ID" = "null" ]; then
            echo "No available iOS simulator runtime found";
            xcrun simctl list runtimes || true;
            exit 1;
          fi
          echo "Using runtime: $RUNTIME_ID"
          DEST_ID=$(xcrun simctl list devices -j \
            | jq -r --arg rid "$RUNTIME_ID" '((.devices[$rid] // []) | map(select(.isAvailable==true)) | map(.udid) | .[0])')
          if [ -z "${DEST_ID:-}" ] || [ "$DEST_ID" = "null" ]; then
            echo "No device under $RUNTIME_ID, falling back to any available device";
            DEST_ID=$(xcrun simctl list devices -j \
              | jq -r '[.devices[] | .[] | select(.isAvailable==true) | .udid][0]')
          fi
          if [ -z "${DEST_ID:-}" ] || [ "$DEST_ID" = "null" ]; then
            echo "No available iOS Simulator device";
            xcrun simctl list devices || true;
            exit 1;
          fi
          DD="$GITHUB_WORKSPACE/DerivedData"
          mkdir -p "$DD" Result || true
          xcodebuild test \
            -workspace BidOn.xcworkspace \
            -scheme AdaptersTests \
            -sdk iphonesimulator \
            -destination "id=$DEST_ID" \
            -derivedDataPath "$DD" \
            -resultBundlePath Result/AdaptersTests.xcresult \
            | xcbeautify

      - name: Collect deprecated warnings (xcresult)
        run: |
          set -euo pipefail
          mkdir -p build/reports/deprecations
          # Dump xcresult to JSON
          xcrun xcresulttool get --path Result/AdaptersTests.xcresult --format json > build/reports/deprecations/xcresult.json || true
          # Extract deprecation warnings for adapter sources only
          jq -r '
            [
              .. | objects
              | select(.issueType? or .type? or .diagnosticType?)
              | {text: (.message?.text? // .text? // ""), url: (.documentLocation?.url? // .location?.url? // "")}
              | select(.text|test("deprecated"; "i"))
              | select(.url|test("/Adapters/"))
            ]
          ' build/reports/deprecations/xcresult.json > build/reports/deprecations/deprecations.json || echo "[]" > build/reports/deprecations/deprecations.json
          COUNT=$(jq 'length' build/reports/deprecations/deprecations.json 2>/dev/null || echo 0)
          {
            echo "# Adapters Deprecated API Report";
            echo "";
            echo "- Findings: ${COUNT}";
            echo "";
            if [ "$COUNT" -gt 0 ]; then
              echo "## Items";
              jq -r '.[] | "- " + (.url|sub("^file:///"; "")) + " — " + (.text|gsub("\n"; " "))' build/reports/deprecations/deprecations.json
            else
              echo "No deprecated API usage found in adapter sources.";
            fi
          } > build/reports/deprecations/deprecations.md
          echo "\n" >> "$GITHUB_STEP_SUMMARY"
          cat build/reports/deprecations/deprecations.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deprecations report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapters-deprecations-report
          path: |
            build/reports/deprecations/deprecations.json
            build/reports/deprecations/deprecations.md

      - name: Build SDK via Fastlane
        run: |
          /opt/homebrew/opt/ruby/bin/bundle exec fastlane sdk \
            version:${{ inputs.sdk_version }} \
            pre:"${{ inputs.pre }}" \
            adapters_revision:"${{ inputs.adapters_revision }}" \
            use_network_versions:${{ inputs.use_network_versions }} \
            upload:${{ inputs.upload }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}

      - name: Setup SSH for podspec repo
        if: ${{ inputs.push_specs }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.POD_REPO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Register CocoaPods repo
        if: ${{ inputs.push_specs }}
        run: |
          pod repo remove bidon || true
          pod repo add bidon git@github.com:bidon-io/CocoaPods-Specs.git

      - name: Push main Bidon podspec first
        if: ${{ inputs.push_specs }}
        run: |
          echo "Pushing Bidon.podspec.json first..."
          pod repo push bidon build/Podspecs/Bidon.podspec.json --allow-warnings --skip-tests --skip-import-validation

      - name: Push adapter podspecs
        if: ${{ inputs.push_specs }}
        run: |
          for spec in build/Podspecs/*.podspec.json; do
            if [[ "$spec" != *"Bidon.podspec.json" ]]; then
              echo "Pushing $spec..."
              pod repo push bidon "$spec" --allow-warnings --skip-tests --skip-import-validation
            fi
          done

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *[Bidon] SDK Build Succeeded!*\n• Version: `${{ inputs.sdk_version }}`\n• Pre: `${{ inputs.pre }}`\n• Adapters revision: `${{ inputs.adapters_revision }}`\n• Use network versions: `${{ inputs.use_network_versions }}`\n• Upload: `${{ inputs.upload }}`\n• Specs pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *[Bidon] SDK Build Failed!*\n• Version: `${{ inputs.sdk_version }}`\n• Pre: `${{ inputs.pre }}`\n• Adapters revision: `${{ inputs.adapters_revision }}`\n• Use network versions: `${{ inputs.use_network_versions }}`\n• Upload: `${{ inputs.upload }}`\n• Specs pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
