name: Build Bidon SDK v2

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version (e.g. 1.1.0)'
        required: true
        type: string
      pre:
        description: 'Prerelease tag (e.g. alpha.1, ver.1)'
        required: false
        type: string
        default: ''
      adapters_revision:
        description: 'Adapters revision (number or mapping, e.g. 0 or BidonAdapterMoloco=2)'
        required: false
        type: string
        default: '0'
      use_network_versions:
        description: 'Use network SDK versions for adapters'
        required: false
        type: boolean
        default: true
      upload:
        description: 'Upload to AWS?'
        required: true
        type: boolean
        default: false
      push_specs:
        description: 'Push generated podspecs to repo?'
        required: true
        type: boolean
        default: false

jobs:
  build-bidon-sdk:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: gitconfig
        run: |
            git config --global user.name "bidon-runner"
            git config --global user.email "runner@bidon.org"

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
        
      - name: Prepare Xcode (safe)
        run: |
          xcodebuild -runFirstLaunch || true
          xcodebuild -license accept || true
          rm -rf ~/Library/Developer/Xcode/DerivedData || true

      - name: Ensure iOS device SDK is available
        run: |
          echo "Before:"
          xcodebuild -showsdks || true
          echo "Downloading iOS platform (safe)…"
          xcodebuild -downloadPlatform iOS || true
          echo "After:"
          xcodebuild -showsdks || true

      - name: Show SDKs & destinations (diagnostics)
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcodebuild -showdestinations -workspace BidOn.xcworkspace -scheme Bidon

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.4'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Configure GitHub token for CocoaPods (avoid rate limits)
        run: |
          echo "machine github.com login ${{ secrets.GITHUB_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: dd-${{ runner.os }}-xcode-16.2-${{ hashFiles('Podfile.lock') }}-${{ inputs.sdk_version }}
          restore-keys: |
            dd-${{ runner.os }}-xcode-16.2-

      - name: Install CocoaPods (Fastlane)
        run: bundle exec fastlane pods_install

      - name: Run adapter tests
        run: |
          set -euo pipefail
          echo "Selecting iOS Simulator that matches installed SDK…"
          SDK_VER=$(xcodebuild -version -sdk iphonesimulator 2>/dev/null | awk '/ProductVersion:/ {print $2; exit}')
          if [ -z "${SDK_VER:-}" ]; then
            echo "Failed to detect iphonesimulator SDK version"; xcodebuild -showsdks || true; exit 1;
          fi
          SDK_VER_TAG="iOS-${SDK_VER//./-}"
          DEST_ID=$(xcrun simctl list devices available -j \
            | jq -r --arg ver "$SDK_VER_TAG" '[.devices[] | .[] | select(.isAvailable==true and (.runtime|test($ver))) | .udid][0]')
          if [ -z "${DEST_ID:-}" ] || [ "$DEST_ID" = "null" ]; then
            echo "No available simulator matching runtime $SDK_VER_TAG";
            xcrun simctl list devices || true;
            exit 1;
          fi
          DD="$GITHUB_WORKSPACE/DerivedData"
          mkdir -p "$DD" Result || true
          xcodebuild test \
            -workspace BidOn.xcworkspace \
            -scheme AdaptersTests \
            -sdk iphonesimulator \
            -destination "id=$DEST_ID" \
            -derivedDataPath "$DD" \
            -resultBundlePath Result/AdaptersTests.xcresult \
            | xcbeautify

      - name: Build SDK via Fastlane
        run: |
          bundle exec fastlane sdk \
            version:${{ inputs.sdk_version }} \
            pre:"${{ inputs.pre }}" \
            adapters_revision:"${{ inputs.adapters_revision }}" \
            use_network_versions:${{ inputs.use_network_versions }} \
            upload:${{ inputs.upload }}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}

      - name: Setup SSH for podspec repo
        if: ${{ inputs.push_specs }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.POD_REPO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Register CocoaPods repo
        if: ${{ inputs.push_specs }}
        run: |
          pod repo remove bidon || true
          pod repo add bidon git@github.com:bidon-io/CocoaPods-Specs.git

      - name: Push main Bidon podspec first
        if: ${{ inputs.push_specs }}
        run: |
          echo "Pushing Bidon.podspec.json first..."
          pod repo push bidon build/Podspecs/Bidon.podspec.json --allow-warnings --skip-tests --skip-import-validation

      - name: Push adapter podspecs
        if: ${{ inputs.push_specs }}
        run: |
          for spec in build/Podspecs/*.podspec.json; do
            if [[ "$spec" != *"Bidon.podspec.json" ]]; then
              echo "Pushing $spec..."
              pod repo push bidon "$spec" --allow-warnings --skip-tests --skip-import-validation
            fi
          done

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *[Bidon] SDK Build Succeeded!*\n• Version: `${{ inputs.sdk_version }}`\n• Pre: `${{ inputs.pre }}`\n• Adapters revision: `${{ inputs.adapters_revision }}`\n• Use network versions: `${{ inputs.use_network_versions }}`\n• Upload: `${{ inputs.upload }}`\n• Specs pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *[Bidon] SDK Build Failed!*\n• Version: `${{ inputs.sdk_version }}`\n• Pre: `${{ inputs.pre }}`\n• Adapters revision: `${{ inputs.adapters_revision }}`\n• Use network versions: `${{ inputs.use_network_versions }}`\n• Upload: `${{ inputs.upload }}`\n• Specs pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
