name: Build Bidon SDK v2

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version (e.g. 1.1.0)'
        required: true
        type: string
      pre:
        description: 'Prerelease tag (e.g. alpha.1, ver.1)'
        required: false
        type: string
        default: ''
      adapters_revision:
        description: 'Adapters revision (number or mapping, e.g. 0 or BidonAdapterMoloco=2)'
        required: false
        type: string
        default: '0'
      use_network_versions:
        description: 'Use network SDK versions for adapters'
        required: false
        type: boolean
        default: true
      upload:
        description: 'Upload to AWS?'
        required: true
        type: boolean
        default: false
      push_specs:
        description: 'Push generated podspecs to repo?'
        required: true
        type: boolean
        default: false

jobs:
  build-bidon-sdk:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: gitconfig
        run: |
            git config --global user.name "bidon-runner"
            git config --global user.email "runner@bidon.org"

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app
        
      - name: Prepare Xcode iOS platform
        run: |
          sudo xcodebuild -runFirstLaunch || true
          sudo xcodebuild -license accept || true
          sudo xcodebuild -downloadPlatform iOS
          rm -rf ~/Library/Developer/Xcode/DerivedData || true

      - name: Show SDKs & destinations (diagnostics)
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcodebuild -showdestinations -workspace BidOn.xcworkspace -scheme Bidon

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.4'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build SDK via Fastlane
        run: |
          bundle exec fastlane sdk \
            version:${{ inputs.sdk_version }} \
            pre:"${{ inputs.pre }}" \
            adapters_revision:"${{ inputs.adapters_revision }}" \
            use_network_versions:${{ inputs.use_network_versions }} \
            upload:false
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}

      - name: Discover adapter schemes
        id: adapters
        run: |
          set -e
          SCHEMES_JSON=$(xcodebuild -list -json -workspace BidOn.xcworkspace)
          echo "$SCHEMES_JSON" > schemes.json
          ADAPTERS=$(ruby -e '
            require "json";
            j = JSON.parse(File.read("schemes.json"));
            schemes = (j.dig("workspace","schemes") || []);
            names = schemes.select { |s|
              (s.start_with?("BidonAdapter") || s == "ISBidonCustomAdapter" || s == "AppLovinMediationBidonAdapter")
            }.reject { |s|
              s.end_with?("Tests") || s == "BidonAdapterYandex"
            };
            puts names.join(" ")
          ')
          echo "names=$ADAPTERS" >> $GITHUB_OUTPUT

      - name: Test, package and upload adapters (continue on error)
        run: |
          set -u
          FAILS=()
          ALL=( ${{ steps.adapters.outputs.names }} )
          for NAME in ${{ steps.adapters.outputs.names }}; do
            echo "===== Running adapter_ci for $NAME ====="
            if bundle exec fastlane adapter_ci name:$NAME sdk_version:${{ inputs.sdk_version }} pre:"${{ inputs.pre }}" use_network_versions:${{ inputs.use_network_versions }} upload:${{ inputs.upload }} run_tests:true pods:false; then
              echo "OK: $NAME"
            else
              echo "FAILED: $NAME"
              FAILS+=($NAME)
            fi
          done
          echo "Failed adapters: ${FAILS[*]:-none}"
          # Prepare JSON and Markdown reports
          mkdir -p build/reports
          PASSED_COUNT=$(( ${#ALL[@]} - ${#FAILS[@]} ))
          jq -n --argjson total ${#ALL[@]} --argjson passed $PASSED_COUNT --arg failed "$(printf '%s\n' "${FAILS[@]}" | jq -R . | jq -s .)" '{total:$total, passed:$passed, failed:$failed}' > build/reports/adapters_test_report.json
          {
            echo "# Adapters Test Report";
            echo "";
            echo "- Total adapters: ${#ALL[@]}";
            echo "- Passed: $PASSED_COUNT";
            echo "- Failed: ${#FAILS[@]}";
            echo "";
            if [ ${#FAILS[@]} -gt 0 ]; then
              echo "## Failed";
              for f in "${FAILS[@]}"; do echo "- $f"; done;
            else
              echo "All adapters passed.";
            fi;
          } > build/reports/adapters_test_report.md
          cat build/reports/adapters_test_report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload adapters test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapters-test-report
          path: |
            build/reports/adapters_test_report.json
            build/reports/adapters_test_report.md

      - name: Setup SSH for podspec repo
        if: ${{ inputs.push_specs }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.POD_REPO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Register CocoaPods repo
        if: ${{ inputs.push_specs }}
        run: |
          pod repo remove bidon || true
          pod repo add bidon git@github.com:bidon-io/CocoaPods-Specs.git

      - name: Push main Bidon podspec first
        if: ${{ inputs.push_specs }}
        run: |
          echo "Pushing Bidon.podspec.json first..."
          pod repo push bidon build/Podspecs/Bidon.podspec.json --allow-warnings --skip-tests --skip-import-validation

      - name: Push adapter podspecs
        if: ${{ inputs.push_specs }}
        run: |
          for spec in build/Podspecs/*.podspec.json; do
            if [[ "$spec" != *"Bidon.podspec.json" ]]; then
              echo "Pushing $spec..."
              pod repo push bidon "$spec" --allow-warnings --skip-tests --skip-import-validation
            fi
          done

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *[Bidon] SDK Build Succeeded!*\n• Version: `${{ inputs.sdk_version }}`\n• Pre: `${{ inputs.pre }}`\n• Adapters revision: `${{ inputs.adapters_revision }}`\n• Use network versions: `${{ inputs.use_network_versions }}`\n• Upload: `${{ inputs.upload }}`\n• Specs pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *[Bidon] SDK Build Failed!*\n• Version: `${{ inputs.sdk_version }}`\n• Pre: `${{ inputs.pre }}`\n• Adapters revision: `${{ inputs.adapters_revision }}`\n• Use network versions: `${{ inputs.use_network_versions }}`\n• Upload: `${{ inputs.upload }}`\n• Specs pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
