name: Claude Fix Deprecations

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-fix-deprecations-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      phase: ${{ steps.gate.outputs.phase }}
      run: ${{ steps.gate.outputs.run }}
    # PR comments are issue comments with pull_request field.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'claude[bot]' &&
      contains(github.event.comment.body, '@claude') &&
      (
        contains(github.event.comment.body, 'Deprecated warnings found') ||
        contains(github.event.comment.body, 'Build/Test errors found')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PODS_UPDATER_APP_ID }}
          private-key: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY }}

      - name: Fetch pull request info
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              core.setFailed(`Refusing to auto-commit to fork: head repo is ${pr.head.repo.full_name}`);
              return;
            }
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo_full_name', pr.head.repo.full_name);

      - name: Decide whether to run Claude (prevent loops)
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.issue.number;
            const body = (context.payload.comment?.body || '');

            const phase = body.includes('Build/Test errors found')
              ? 'tests'
              : 'deprecations';

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const labels = (pr.labels || []).map(l => l.name);

            const DEPR_LABEL = 'claude:deprecations-fixed';
            const TESTS_LABEL = 'claude:tests-fixed';

            let run = true;
            if (phase === 'deprecations' && labels.includes(DEPR_LABEL)) run = false;
            if (phase === 'tests' && labels.includes(TESTS_LABEL)) run = false;

            core.notice(`Phase=${phase}; run=${run}; labels=[${labels.join(', ')}]`);
            core.setOutput('phase', phase);
            core.setOutput('run', run ? 'true' : 'false');

      - name: Checkout PR branch
        uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
          # We only support branches within the same repo for auto-commit.
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.run == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "bidon-pods-updater,bidon-pods-updater[bot]"
          trigger_phrase: "@claude"
          show_full_output: true
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 40
            --dangerously-skip-permissions

      - name: Mark Claude phase as done (label PR)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.issue.number;
            const phase = `${{ steps.gate.outputs.phase }}`;

            const label = phase === 'tests'
              ? { name: 'claude:tests-fixed', color: '5319e7', description: 'Claude attempted to fix adapter tests errors' }
              : { name: 'claude:deprecations-fixed', color: '0e8a16', description: 'Claude attempted to fix deprecated warnings' };

            // Ensure label exists (best-effort)
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label.name });
            } catch (e) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (e2) {
                core.notice(`Could not create label '${label.name}': ${e2.message}`);
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [label.name],
            });

  adapter-tests:
    name: Run adapter tests (after Claude)
    needs: claude
    if: always() && needs.claude.outputs.run == 'true'
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PODS_UPDATER_APP_ID }}
          private-key: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.claude.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify Xcode (self-hosted)
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: CocoaPods repo update (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" repo update 2>&1 | tee "$RUNNER_TEMP/pod_repo_update.log"

      - name: CocoaPods install (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" install 2>&1 | tee "$RUNNER_TEMP/pod_install.log"

      - name: Run adapter tests
        id: tests
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Selecting iOS Simulator runtime via simctl…"
          RUNTIME_ID=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select((.availability?=="(available)" or .isAvailable==true) and (.identifier|test("iOS"))) | .identifier] | sort | last')
          if [ -z "${RUNTIME_ID:-}" ] || [ "$RUNTIME_ID" = "null" ]; then
            echo "No available iOS simulator runtime found";
            xcrun simctl list runtimes || true;
            exit 1;
          fi
          echo "Using runtime: $RUNTIME_ID"
          DEST_ID=$(xcrun simctl list devices -j \
            | jq -r --arg rid "$RUNTIME_ID" '((.devices[$rid] // []) | map(select(.isAvailable==true)) | map(.udid) | .[0])')
          if [ -z "${DEST_ID:-}" ] || [ "$DEST_ID" = "null" ]; then
            echo "No device under $RUNTIME_ID, falling back to any available device";
            DEST_ID=$(xcrun simctl list devices -j \
              | jq -r '[.devices[] | .[] | select(.isAvailable==true) | .udid][0]')
          fi
          if [ -z "${DEST_ID:-}" ] || [ "$DEST_ID" = "null" ]; then
            echo "No available iOS Simulator device";
            xcrun simctl list devices || true;
            exit 1;
          fi

          DD="$GITHUB_WORKSPACE/DerivedData"
          mkdir -p "$DD" Result build/reports/deprecations || true

          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild test \
              -workspace BidOn.xcworkspace \
              -scheme AdaptersTests \
              -sdk iphonesimulator \
              -destination "id=$DEST_ID" \
              -derivedDataPath "$DD" \
              -resultBundlePath Result/AdaptersTests.xcresult \
               | tee build/reports/deprecations/test_output.log \
               | xcbeautify
          else
            xcodebuild test \
              -workspace BidOn.xcworkspace \
              -scheme AdaptersTests \
              -sdk iphonesimulator \
              -destination "id=$DEST_ID" \
              -derivedDataPath "$DD" \
              -resultBundlePath Result/AdaptersTests.xcresult \
               | tee build/reports/deprecations/test_output.log
          fi

      - name: Collect adapter errors report
        id: adapter_errors
        if: always()
        run: |
          set -euo pipefail
          ruby .github/scripts/collect_adapter_errors_report.rb \
            --log build/reports/deprecations/test_output.log \
            --out build/reports/adapter-errors/adapter_errors.md

      - name: Upload adapter errors report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-errors-report
          path: |
            build/reports/adapter-errors/adapter_errors.md
            build/reports/adapter-errors/adapter_errors.txt

      - name: Comment PR with adapter errors
        if: always() && steps.tests.outcome != 'success' && steps.adapter_errors.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.issue.number;
            const mdPath = 'build/reports/adapter-errors/adapter_errors.md';
            let body = '';
            try {
              body = fs.readFileSync(mdPath, 'utf8');
            } catch (e) {
              body = `Adapter errors report was generated but could not be read: ${e.message}`;
            }

            // Prevent infinite loop: after we already ran Claude for tests once,
            // do not post another '@claude' trigger comment. Instead, post a non-triggering info comment.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const labels = (pr.labels || []).map(l => l.name);
            if (labels.includes('claude:tests-fixed')) {
              core.notice('claude:tests-fixed label is present; posting non-triggering info comment.');
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              // Remove any accidental @claude line(s) to avoid retrigger.
              const safeBody = body
                .replace(/^@claude[^\n]*\n?/gmi, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
              const infoHeader =
                `ℹ️ Claude already attempted to fix test errors once, but \`AdaptersTests\` is still failing.\n\n` +
                `- Please check the artifact: \`adapter-errors-report\`\n` +
                `- Workflow run: ${runUrl}\n\n`;
              const finalBody = (infoHeader + safeBody).slice(0, 60000) + ((infoHeader + safeBody).length > 60000 ? "\n\n(truncated)" : "");
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: finalBody,
              });
              return;
            }

            let finalBody = body;
            // GitHub comment body limit ~65536
            if (finalBody.length > 60000) finalBody = finalBody.slice(0, 60000) + "\n\n(truncated)";
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: finalBody,
            });

      - name: Fail job if tests failed
        if: steps.tests.outcome != 'success'
        run: |
          exit 1
