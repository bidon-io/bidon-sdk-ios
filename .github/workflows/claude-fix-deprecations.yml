name: Claude Fix Deprecations

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-fix-deprecations-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # PR comments are issue comments with pull_request field.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'claude[bot]' &&
      contains(github.event.comment.body, '@claude') &&
      contains(github.event.comment.body, 'Deprecated warnings found')
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PODS_UPDATER_APP_ID }}
          private-key: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY }}

      - name: Dedupe trigger comment (avoid duplicate deliveries)
        id: dedupe
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commentId = context.payload.comment?.id;
            if (!commentId) {
              core.warning('No comment id in payload; continuing without dedupe.');
              core.setOutput('skip', 'false');
              return;
            }

            // Use reactions as a lightweight, cross-run lock to dedupe
            // duplicate event deliveries for the same comment.
            // NOTE: Reactions API still requires the "squirrel-girl" preview in some environments.
            const content = 'rocket';
            const mediaType = { previews: ['squirrel-girl'] };

            const reactions = await github.paginate(
              github.rest.reactions.listForIssueComment,
              { owner, repo, comment_id: commentId, per_page: 100, mediaType }
            );

            // Dedupe regardless of which account applied the reaction.
            // If humans can add the same reaction, pick a different marker.
            const alreadyMarked = reactions.some(r => r?.content === content);
            if (alreadyMarked) {
              core.notice(`Comment already marked with '${content}' reaction; skipping duplicate run.`);
              core.setOutput('skip', 'true');
              return;
            }

            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: commentId,
              content,
              mediaType,
            });

            core.setOutput('skip', 'false');

      - name: Fetch pull request info
        id: pr
        uses: actions/github-script@v7
        if: steps.dedupe.outputs.skip != 'true'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              core.setFailed(`Refusing to auto-commit to fork: head repo is ${pr.head.repo.full_name}`);
              return;
            }
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo_full_name', pr.head.repo.full_name);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        if: steps.dedupe.outputs.skip != 'true'
        with:
          fetch-depth: 0
          # We only support branches within the same repo for auto-commit.
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        if: steps.dedupe.outputs.skip != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "bidon-pods-updater,bidon-pods-updater[bot]"
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 50
            --dangerously-skip-permissions
