name: Claude Fix Deprecations

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-fix-deprecations-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # PR comments are issue comments with pull_request field.
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'claude[bot]' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PODS_UPDATER_APP_ID_V2 }}
          private-key: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY_V2 }}

      - name: Fetch pull request info
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              core.setFailed(`Refusing to auto-commit to fork: head repo is ${pr.head.repo.full_name}`);
              return;
            }
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo_full_name', pr.head.repo.full_name);

      - name: Decide whether to run Claude (prevent loops)
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.issue.number;
            const body = (context.payload.comment?.body || '');

            let phase = 'unknown';
            if (body.includes('Build errors found') || body.includes('Build/Test errors found')) phase = 'build';
            else if (body.includes('Deprecated warnings found')) phase = 'deprecations';
            else if (body.includes('Test failures found')) phase = 'tests';
            else if (body.includes('Update CHANGELOG')) phase = 'changelog';

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const labels = (pr.labels || []).map(l => l.name);

            const BUILD_LABEL = 'claude:build-fixed';
            const DEPR_LABEL = 'claude:deprecations-fixed';
            const TESTS_LABEL = 'claude:tests-fixed';
            const CHANGELOG_LABEL = 'claude:changelog-updated';

            let run = true;
            if (phase === 'build' && labels.includes(BUILD_LABEL)) run = false;
            if (phase === 'deprecations' && labels.includes(DEPR_LABEL)) run = false;
            if (phase === 'tests' && labels.includes(TESTS_LABEL)) run = false;
            if (phase === 'changelog' && labels.includes(CHANGELOG_LABEL)) run = false;

            core.notice(`Phase=${phase}; run=${run}; labels=[${labels.join(', ')}]`);
            core.setOutput('phase', phase);
            core.setOutput('run', run ? 'true' : 'false');
            core.setOutput('deprecations_fixed', labels.includes(DEPR_LABEL) ? 'true' : 'false');

      - name: Checkout PR branch
        uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
          # We only support branches within the same repo for auto-commit.
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Switch to local branch (fix detached HEAD)
        if: steps.gate.outputs.run == 'true'
        run: |
          git checkout -B ${{ steps.pr.outputs.head_ref }} origin/${{ steps.pr.outputs.head_ref }}
          git branch --set-upstream-to=origin/${{ steps.pr.outputs.head_ref }}
          echo "Current branch:"
          git branch -vv
          echo "HEAD:"
          git rev-parse HEAD
          echo "Remote HEAD:"
          git ls-remote origin ${{ steps.pr.outputs.head_ref }}

      - name: Configure git
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.run == 'true'
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY_SDK }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "bidon-pods-updater,bidon-pods-updater[bot],bidon-pods-updater2,bidon-pods-updater2[bot]"
          trigger_phrase: "@claude"
          show_full_output: true
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 40
            --dangerously-skip-permissions

      - name: Mark Claude phase as done (label PR)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.issue.number;
            const phase = `${{ steps.gate.outputs.phase }}`;

            const labelMap = {
              build:        { name: 'claude:build-fixed',        color: 'e11d48', description: 'Claude attempted to fix build errors' },
              tests:        { name: 'claude:tests-fixed',        color: '5319e7', description: 'Claude attempted to fix adapter tests errors' },
              deprecations: { name: 'claude:deprecations-fixed', color: '0e8a16', description: 'Claude attempted to fix deprecated warnings' },
              changelog:    { name: 'claude:changelog-updated',  color: '0366d6', description: 'Claude updated CHANGELOG files' },
            };
            const label = labelMap[phase];
            if (!label) {
              core.notice(`Unknown phase '${phase}'; skipping label.`);
              return;
            }

            // Ensure label exists (best-effort)
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label.name });
            } catch (e) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (e2) {
                core.notice(`Could not create label '${label.name}': ${e2.message}`);
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [label.name],
            });
