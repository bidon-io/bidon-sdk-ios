name: Claude Code

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-code-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only run on PR comments containing @claude (not from claude bot itself)
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login != 'claude[bot]' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PODS_UPDATER_APP_ID_V2 }}
          private-key: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY_V2 }}

      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Security: only allow same repo branches (not forks)
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              core.setFailed(`Refusing to auto-commit to fork: ${pr.head.repo.full_name}`);
              return;
            }

            core.setOutput('head_ref', pr.head.ref);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Switch to local branch (fix detached HEAD)
        run: |
          git checkout -B ${{ steps.pr.outputs.head_ref }} origin/${{ steps.pr.outputs.head_ref }}
          git branch --set-upstream-to=origin/${{ steps.pr.outputs.head_ref }}

      - name: Configure git
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY_SDK }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "@claude"
          allowed_bots: "bidon-pods-updater,bidon-pods-updater[bot],bidon-pods-updater2,bidon-pods-updater2[bot],bidon-dependabot,bidon-dependabot[bot]"
          show_full_output: true
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 40
            --dangerously-skip-permissions
