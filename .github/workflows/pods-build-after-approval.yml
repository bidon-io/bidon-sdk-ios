name: Pods Build after Approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read

jobs:
  build-after-approval:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]
    if: >
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'chore/pod-') &&
      github.event.pull_request.base.ref == 'develop'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Extract build metadata
        id: meta
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ruby - <<'RUBY'
          body = ENV['PR_BODY'].to_s
          m = body.match(/<!--\s*build-metadata\s*(\{[\s\S]*?\})\s*-->/m)
          if m
            require 'json'
            data = JSON.parse(m[1])
            adapters = data['adapters']
            if adapters.nil?
              adapter = data['adapter']
              adapters = adapter ? [adapter] : []
            end
            File.open(ENV['GITHUB_OUTPUT'], 'a') do |f|
              f.puts "pod=#{data['pod']}"
              f.puts "from=#{data['from']}"
              f.puts "to=#{data['to']}"
              f.puts "adapters=#{adapters.join(',')}"
              f.puts "adapter=#{adapters.first}"
            end
          end
          RUBY

      - name: Ensure adapters metadata present
        if: steps.meta.outputs.adapters == ''
        run: |
          echo "No adapters found in build metadata"
          exit 1

      - name: Ensure AWS CLI
        run: |
          set -e
          if [ -x /opt/homebrew/bin/brew ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          if ! command -v aws >/dev/null 2>&1; then
            brew update
            brew install awscli
          fi
          aws --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_APPODEAL_OIDC_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ secrets.S3_REGION }}

      - name: AWS whoami
        run: aws sts get-caller-identity

      - name: Verify Xcode
        run: xcodebuild -version

      - name: CocoaPods install
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          "$POD_BIN" install 2>&1 | tee "$RUNNER_TEMP/pod_install.log"

      - name: Cache Ruby gems (Bundler)
        uses: actions/cache@v4
        with:
          path: ~/.bundle/bidon-sdk-ios
          key: ${{ runner.os }}-ruby-3.2-bundle-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.2-bundle-

      - name: Install Ruby gems (Ruby 3.2)
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/opt/ruby@3.2/bin:$PATH"
          bundle config set path ~/.bundle/bidon-sdk-ios
          bundle config set clean 'true'
          bundle check || bundle install --jobs 4 --retry 3 2>&1 | tee "$RUNNER_TEMP/bundle_install.log"

      - name: Ensure xcpretty
        run: |
          set -e
          export PATH="/opt/homebrew/opt/ruby@3.2/bin:$HOME/.bundle/bidon-sdk-ios/bin:$PATH"
          if ! command -v xcpretty >/dev/null 2>&1; then
            gem install xcpretty -N
          fi

      - name: Read SDK last release version
        id: sdk
        run: |
          set -e
          VERSION=$(sed -n 's/^[[:space:]]*static let sdkVersionLastRelease: String = "\([^"]*\)".*/\1/p' Bidon/Shared/Constants.swift | head -n1)
          [ -n "$VERSION" ] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build adapters via Fastlane
        if: steps.meta.outputs.adapters != ''
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -euo pipefail
          export CI=1 FASTLANE_SKIP_UPDATE_CHECK=1
          export PATH="/opt/homebrew/opt/ruby@3.2/bin:$HOME/.bundle/bidon-sdk-ios/bin:$PATH"
          unset GEM_HOME GEM_PATH RUBYLIB RUBYOPT || true

          IFS=',' read -ra ADAPTERS <<< "${{ steps.meta.outputs.adapters }}"
          for AD in "${ADAPTERS[@]}"; do
            bundle exec fastlane adapter \
              name:"$AD" \
              sdk_version:"${{ steps.sdk.outputs.version }}" \
              upload:true \
              force_upload:true
          done

      - name: Push adapter podspecs
        if: steps.meta.outputs.adapters != ''
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -e
          pod repo remove bidon || true
          pod repo add bidon git@github.com:bidon-io/CocoaPods-Specs.git
          IFS=',' read -ra ADAPTERS <<< "${{ steps.meta.outputs.adapters }}"
          for AD in "${ADAPTERS[@]}"; do
            pod repo push bidon "build/Podspecs/${AD}.podspec.json" \
              --allow-warnings --skip-tests --skip-import-validation
          done

      - name: Debug merge permissions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY} --jq '.permissions' || true

      - name: Enable PR auto-merge (PAT)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail

          SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="$(gh api "repos/${{ github.repository }}/commits/${SHA}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq '.[0].number')"

          [ -n "$PR_NUMBER" ] || exit 1

          gh pr merge \
            -R "${{ github.repository }}" \
            --squash \
            --auto \
            "$PR_NUMBER"
