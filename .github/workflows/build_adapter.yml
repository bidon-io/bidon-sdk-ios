name: Build Adapter

on:
  workflow_dispatch:
    inputs:
      adapter_name:
        description: 'Adapter name (e.g. BidonAdapterIronSource)'
        required: true
        type: string
      sdk_version:
        description: 'SDK version (e.g. 3.0.1)'
        required: true
        type: string
      upload:
        description: 'Upload to AWS?'
        required: true
        type: boolean
        default: false
      push_specs:
        description: 'Push generated podspec to repo?'
        required: true
        type: boolean
        default: false

jobs:
  build-adapter:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode (self-hosted)
        run: |
          xcodebuild -version

      # На self-hosted fastlane/pods установлены глобально (Ruby 3.2)
      - name: CocoaPods install (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" install 2>&1 | tee "$RUNNER_TEMP/pod_install.log"

      - name: Cache Ruby gems (Bundler)
        uses: actions/cache@v4
        with:
          path: ~/.bundle/bidon-sdk-ios
          key: ${{ runner.os }}-ruby-3.2-bundle-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.2-bundle-

      - name: Install Ruby gems for fastlane (Ruby 3.2)
        run: |
          set -o pipefail
          /opt/homebrew/opt/ruby@3.2/bin/bundle config set path ~/.bundle/bidon-sdk-ios
          /opt/homebrew/opt/ruby@3.2/bin/bundle config set clean 'true'
          /opt/homebrew/opt/ruby@3.2/bin/bundle check || /opt/homebrew/opt/ruby@3.2/bin/bundle install --jobs 4 --retry 3 2>&1 | tee "$RUNNER_TEMP/bundle_install.log"

      - name: Run Fastlane lane :adapter
        run: |
          set -o pipefail
          export CI=1 NSUnbufferedIO=YES FASTLANE_SKIP_UPDATE_CHECK=1
          export PATH="/opt/homebrew/opt/ruby@3.2/bin:$HOME/.bundle/bidon-sdk-ios/bin:$PATH"
          unset GEM_HOME GEM_PATH RUBYLIB RUBYOPT || true
          /opt/homebrew/opt/ruby@3.2/bin/bundle exec fastlane adapter \
            name:"${{ inputs.adapter_name }}" \
            sdk_version:"${{ inputs.sdk_version }}" \
            upload:${{ inputs.upload }} 2>&1 | tee "$RUNNER_TEMP/fastlane_adapter.log"
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}

      - name: Setup SSH for podspec repo
        if: ${{ inputs.push_specs }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.POD_REPO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Register CocoaPods repo
        if: ${{ inputs.push_specs }}
        run: |
          pod repo remove bidon || true
          pod repo add bidon git@github.com:bidon-io/CocoaPods-Specs.git

      - name: Push adapter podspec to podspec repo
        if: ${{ inputs.push_specs }}
        run: |
          spec=build/Podspecs/${{ inputs.adapter_name }}.podspec.json
          echo "Pushing $spec..."
          pod repo push bidon "$spec" --allow-warnings --skip-tests --skip-import-validation

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *Adapter Build Succeeded!*\n• Adapter: `${{ inputs.adapter_name }}`\n• SDK: `${{ inputs.sdk_version }}`\n• Upload: `${{ inputs.upload }}`\n• Spec pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *Adapter Build Failed!*\n• Adapter: `${{ inputs.adapter_name }}`\n• SDK: `${{ inputs.sdk_version }}`\n• Upload: `${{ inputs.upload }}`\n• Spec pushed: `${{ inputs.push_specs }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
