name: Pods Updater (self-hosted)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: gitconfig
        run: |
          git config --global user.name "bidon-runner"
          git config --global user.email "runner@bidon.org"
          git config --global credential.helper ""

      - name: CocoaPods repo update (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" repo update 2>&1 | tee "$RUNNER_TEMP/pod_repo_update.log"

      - name: Check runner clock vs GitHub (delta)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
import subprocess, email.utils, datetime, re

local = datetime.datetime.utcnow()

hdr = subprocess.check_output(
    ["bash", "-lc", "curl -sI https://api.github.com/"]
).decode()

m = re.search(r"^Date:\s*(.+)$", hdr, re.M)
gh = email.utils.parsedate_to_datetime(m.group(1)).replace(tzinfo=None) if m else None

print("Local UTC :", local.strftime("%Y-%m-%d %H:%M:%S"))
print("GitHub UTC :", gh.strftime("%Y-%m-%d %H:%M:%S") if gh else "N/A")

if gh:
    delta = (local - gh).total_seconds()
    print("Delta sec :", delta)
    if abs(delta) > 30:
        raise SystemExit("Clock skew > 30s. Fix runner time (NTP).")
PY

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PODS_UPDATER_APP_ID }}
          private-key: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY }}

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PODS_UPDATER_TOKEN: ${{ steps.app-token.outputs.token }}
          PODS_BASE_BRANCH: dev
          PODS_REVIEWERS: "bidon-io/bidon-ios"
        run: |
          export GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          export POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          /opt/homebrew/opt/ruby@3.2/bin/ruby .github/scripts/pods_updater.rb
