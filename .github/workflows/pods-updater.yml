name: Pods Updater (self-hosted)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: gitconfig
        run: |
          git config --global user.name "bidon-runner"
          git config --global user.email "runner@bidon.org"
          git config --global credential.helper ""
          
      - name: Debug GitHub App JWT (calls /app)
        shell: bash
        env:
          APP_ID: ${{ vars.PODS_UPDATER_APP_ID }}
          APP_KEY: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY_V2 }}
        run: |
          set -euo pipefail
          umask 077

          # 1) save key
          KEY_FILE="$RUNNER_TEMP/app_private_key.pem"
          printf '%s' "$APP_KEY" > "$KEY_FILE"

          # 2) quick sanity: RSA parse
          openssl rsa -in "$KEY_FILE" -check -noout >/dev/null

          # 3) build JWT (RS256) without extra deps
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          NOW=$(date +%s)
          IAT=$NOW
          EXP=$((NOW + 540))  # 9 minutes

          HEADER='{"alg":"RS256","typ":"JWT"}'
          PAYLOAD="{\"iat\":$IAT,\"exp\":$EXP,\"iss\":$APP_ID}"

          H64=$(printf '%s' "$HEADER"  | b64url)
          P64=$(printf '%s' "$PAYLOAD" | b64url)
          DATA="$H64.$P64"

          SIG=$(printf '%s' "$DATA" | openssl dgst -sha256 -sign "$KEY_FILE" | b64url)
          JWT="$DATA.$SIG"

          # 4) call GitHub /app using JWT
          CODE=$(curl -sS -o /tmp/app.json -w '%{http_code}' \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/app)

          echo "HTTP /app: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Response:"
            cat /tmp/app.json
            exit 1
          fi

    
      - name: CocoaPods repo update (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" repo update 2>&1 | tee "$RUNNER_TEMP/pod_repo_update.log"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PODS_UPDATER_APP_ID }}
          private-key: ${{ secrets.PODS_UPDATER_APP_PRIVATE_KEY_V2 }}

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PODS_UPDATER_TOKEN: ${{ steps.app-token.outputs.token }}
          PODS_BASE_BRANCH: dev
          PODS_REVIEWERS: "bidon-io/bidon-ios"
        run: |
          export GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          export POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          /opt/homebrew/opt/ruby@3.2/bin/ruby .github/scripts/pods_updater.rb
