name: Build Core v2

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version (e.g. 1.1.0 or 1.1.0-alpha.1)'
        required: true
        type: string
      upload:
        description: 'Upload to AWS?'
        required: true
        type: boolean
        default: false
      force_upload:
        description: 'Force re-upload to S3 even if object exists?'
        required: false
        type: boolean
        default: false
        
permissions:
  id-token: write
  contents: read

jobs:
  build-core-v2:
    runs-on: [self-hosted, macOS, ARM64, xcode-16, bidon]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Ensure AWS CLI (self-hosted)
        run: |
          set -e
          if [ -x /opt/homebrew/bin/brew ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "aws not found; installing via Homebrew..."
            brew update
            brew install awscli
          fi

          aws --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_APPODEAL_OIDC_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ secrets.S3_REGION }}

      - name: AWS whoami
        run: aws sts get-caller-identity


      - name: gitconfig
        run: |
          git config --global user.name "bidon-runner"
          git config --global user.email "runner@bidon.org"

      - name: Verify Xcode (self-hosted)
        run: |
          xcodebuild -version

      - name: CocoaPods install (self-hosted)
        run: |
          set -o pipefail
          GEM_HOME=$(/opt/homebrew/opt/ruby@3.2/bin/gem env home)
          POD_BIN=$(command -v pod || echo "$GEM_HOME/bin/pod")
          echo "Using POD_BIN=$POD_BIN"
          "$POD_BIN" --version || true
          "$POD_BIN" install 2>&1 | tee "$RUNNER_TEMP/pod_install.log"

      - name: Cache Ruby gems (Bundler)
        uses: actions/cache@v4
        with:
          path: ~/.bundle/bidon-sdk-ios
          key: ${{ runner.os }}-ruby-3.2-bundle-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.2-bundle-

      - name: Install Ruby gems for fastlane (Ruby 3.2)
        run: |
          set -o pipefail
          /opt/homebrew/opt/ruby@3.2/bin/bundle config set path ~/.bundle/bidon-sdk-ios
          /opt/homebrew/opt/ruby@3.2/bin/bundle config set clean 'true'
          /opt/homebrew/opt/ruby@3.2/bin/bundle check || /opt/homebrew/opt/ruby@3.2/bin/bundle install --jobs 4 --retry 3 2>&1 | tee "$RUNNER_TEMP/bundle_install.log"

      - name: Ensure Ruby 3.2 PATH and xcpretty
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/ruby@3.2/bin:$HOME/.bundle/bidon-sdk-ios/bin:$PATH"
          # Install xcpretty for Ruby 3.2 if missing (to avoid system Ruby 2.6)
          if ! command -v xcpretty >/dev/null 2>&1; then
            /opt/homebrew/opt/ruby@3.2/bin/gem install xcpretty -N
          fi

      - name: Build Core via Fastlane 
        run: |
          set -o pipefail
          export CI=1 NSUnbufferedIO=YES FASTLANE_SKIP_UPDATE_CHECK=1
          # Force Ruby 3.2 and bundled gem binstubs first
          export PATH="/opt/homebrew/opt/ruby@3.2/bin:$HOME/.bundle/bidon-sdk-ios/bin:$PATH"
          # Avoid leaking system Ruby GEM_* into subprocesses
          unset GEM_HOME GEM_PATH RUBYLIB RUBYOPT || true
          /opt/homebrew/opt/ruby@3.2/bin/bundle exec fastlane core \
            version:${{ inputs.sdk_version }} \
            upload:${{ inputs.upload }} \
            force_upload:${{ inputs.force_upload }} 2>&1 | tee "$RUNNER_TEMP/fastlane_core.log"
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}

      - name: Push core podspec via PR
        if: success()
        uses: ./.github/actions/push-podspecs
        with:
          specs: build/Podspecs/Bidon.podspec.json
          branch_suffix: Bidon-${{ inputs.sdk_version }}
          token: ${{ secrets.PAT_RUNNER }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Push Package.swift via PR
        if: success() && inputs.upload
        uses: ./.github/actions/push-spm-package
        with:
          package_swift: build/Package.swift
          sdk_version: ${{ inputs.sdk_version }}
          token: ${{ secrets.PAT_RUNNER }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Collect podspec URL
        id: podspec_link
        if: success()
        run: |
          set -euo pipefail
          SPEC="build/Podspecs/Bidon.podspec.json"
          if [ ! -f "$SPEC" ]; then
            echo "Podspec not found: $SPEC"
            exit 1
          fi
          VERSION=$(jq -r '.version' "$SPEC" 2>/dev/null || sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$SPEC" | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Version not found in $SPEC"
            exit 1
          fi
          BASE="https://github.com/bidon-io/CocoaPods-Specs/blob/main/Bidon/${VERSION}/Bidon.podspec.json"
          echo "url=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Dump logs tail (on failure)
        if: failure()
        run: |
          set -e
          echo "\nFastlane (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 "$RUNNER_TEMP/fastlane_core.log" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "\nCocoaPods (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 "$RUNNER_TEMP/pod_install.log" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "\nBundle install (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 "$RUNNER_TEMP/bundle_install.log" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          LOG=$(ls -t ~/Library/Logs/fastlane/xcbuild/*/xcodebuild.log 2>/dev/null | head -n1 || true)
          echo "\nxcodebuild.log path: ${LOG:-not found}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOG" ]; then
            echo "xcodebuild (tail)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 300 "$LOG" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect build logs (on failure)
        if: failure()
        run: |
          set -e
          mkdir -p build/ci-logs
          # Fastlane xcodebuild log (if present)
          LOG=$(ls -t ~/Library/Logs/fastlane/xcbuild/*/xcodebuild.log 2>/dev/null | head -n1 || true)
          if [ -f "$LOG" ]; then cp "$LOG" build/ci-logs/fastlane-xcodebuild.log; fi
          # Latest xcactivitylog from DerivedData
          ACT=$(find ~/Library/Developer/Xcode/DerivedData -type f -path "*/Logs/Build/*.xcactivitylog" -print0 | xargs -0 ls -1t 2>/dev/null | head -n1 || true)
          if [ -f "$ACT" ]; then cp "$ACT" build/ci-logs/Build.xcactivitylog; fi
          # Any xcresult bundles if produced by steps
          if [ -d build/Logs ]; then cp -R build/Logs build/ci-logs/xcresult 2>/dev/null || true; fi
          # Our tee'd logs
          cp "$RUNNER_TEMP"/fastlane_core.log build/ci-logs/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/pod_install.log build/ci-logs/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/bundle_install.log build/ci-logs/ 2>/dev/null || true

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/ci-logs

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *Core Build Succeeded!*\n• Version: `${{ inputs.sdk_version }}`\n• Upload: `${{ inputs.upload }}`\n• Force upload: `${{ inputs.force_upload }}`\n• Podspec: <${{ steps.podspec_link.outputs.url }}|Bidon>\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *Core Build Failed!*\n• Version: `${{ inputs.sdk_version }}`\n• Upload: `${{ inputs.upload }}`\n• Force upload: `${{ inputs.force_upload }}`\n• Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


